<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOT! - 夜晚微醺極限挑戰</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Firebase SDK (v9 Modular Scripts) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 您的專屬 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyA5_QR7dEjIx6RTghTqcB5jgCs6c-4nHQY",
            authDomain: "shottime-397a4.firebaseapp.com",
            projectId: "shottime-397a4",
            storageBucket: "shottime-397a4.firebasestorage.app",
            messagingSenderId: "543397406837",
            appId: "1:543397406837:web:79429dc37c8aad0014b03c",
            measurementId: "G-1KCTHMZ8KN"
        };

        // 初始化 Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 將資料庫方法掛載到 window 全局對象，供傳統 JS 呼叫
        window.saveScoreToCloud = async function(playerName, score) {
            try {
                await addDoc(collection(db, "leaderboard"), {
                    name: playerName || "神秘酒客",
                    score: Number(score),
                    createdAt: serverTimestamp()
                });
                return true;
            } catch (e) {
                console.error("寫入 Firestore 失敗:", e);
                return false;
            }
        };

        window.fetchCloudLeaderboard = async function() {
            try {
                const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
                const querySnapshot = await getDocs(q);
                const scores = [];
                querySnapshot.forEach((doc) => {
                    scores.push(doc.data());
                });
                return scores;
            } catch (e) {
                console.error("讀取 Firestore 失敗:", e);
                return null;
            }
        };
    </script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #090514;
            color: #f3f4f6;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .title-font {
            font-family: 'Cinzel', serif;
        }

        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* 霓虹燈光陰影特效 */
        .neon-text-pink {
            text-shadow: 0 0 5px #ff007f, 0 0 15px #ff007f, 0 0 30px #ff007f;
        }
        .neon-text-yellow {
            text-shadow: 0 0 5px #ffd700, 0 0 15px #ffd700, 0 0 25px #ffd700;
        }
        .neon-border-pink {
            box-shadow: 0 0 10px #ff007f, inset 0 0 10px #ff007f;
        }
        .neon-border-purple {
            box-shadow: 0 0 15px #a855f7, inset 0 0 8px #a855f7;
        }

        /* 玻璃擬態樣式 */
        .glass-card {
            background: rgba(20, 15, 35, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* 酒杯與啤酒動態造型 */
        .beer-glass {
            position: relative;
            background: linear-gradient(to right, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.2) 100%);
            border: 4px solid rgba(255, 255, 255, 0.4);
            border-top: none;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,215,0,0.2);
            overflow: hidden;
        }

        .beer-liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(to top, #e67e22, #f1c40f, #f39c12);
            transition: height 0.08s ease-out;
        }

        .beer-foam {
            position: absolute;
            top: -12px;
            left: 0;
            right: 0;
            height: 16px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(255,255,255,0.8);
        }

        /* 氣泡上升動畫 */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            bottom: 0;
            animation: bubbleUp 2s infinite ease-in;
        }

        @keyframes bubbleUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-180px) scale(1.2); opacity: 0; }
        }

        /* 點擊飛出數字 */
        .click-pop {
            position: absolute;
            color: #ffd700;
            font-weight: 900;
            font-size: 1.8rem;
            pointer-events: none;
            animation: popAndFade 0.6s forwards ease-out;
            text-shadow: 0 0 10px #ff007f;
            z-index: 50;
        }

        @keyframes popAndFade {
            0% { transform: translate(-50%, -50%) scale(0.6) rotate(0deg); opacity: 1; }
            50% { transform: translate(-50%, -100%) scale(1.3) rotate(-10deg); opacity: 0.9; }
            100% { transform: translate(-50%, -150%) scale(1) rotate(10deg); opacity: 0; }
        }

        /* 水波波紋動畫 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 0, 127, 0.4);
            transform: scale(0);
            animation: rippleEffect 0.5s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to { transform: scale(4); opacity: 0; }
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 10, 25, 0.6); }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 3px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative select-none">

    <!-- 背景夜店氛圍動態微光 -->
    <div class="absolute inset-0 z-0 opacity-40 pointer-events-none">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-pink-600 rounded-full filter blur-[120px]"></div>
        <div class="absolute bottom-1/4 left-1/3 w-80 h-80 bg-purple-700 rounded-full filter blur-[100px]"></div>
        <div class="absolute top-2/3 right-1/4 w-72 h-72 bg-amber-500 rounded-full filter blur-[110px]"></div>
    </div>

    <!-- 頂部頁首與儀表板 -->
    <header class="w-full max-w-md p-4 z-10 flex flex-col items-center">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-wine-glass-empty text-pink-500 text-2xl animate-pulse"></i>
            <h1 class="text-3xl title-font font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-amber-300 neon-text-pink">
                SHOT!
            </h1>
        </div>
        <p class="text-xs text-gray-400 tracking-wider mt-1 font-light">夜 晚 微 醺 連 點 挑 戰</p>

        <!-- 模式切換鈕 -->
        <div class="flex w-full mt-4 bg-gray-900/80 p-1 rounded-xl border border-purple-900/50 glass-card">
            <button id="mode-casual-btn" onclick="switchMode('casual')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-300 bg-gradient-to-r from-pink-600 to-purple-600 text-white shadow-lg">
                <i class="fa-solid fa-beer-mug-empty mr-1"></i> 輕鬆喝模式
            </button>
            <button id="mode-extreme-btn" onclick="switchMode('extreme')" class="flex-1 py-2 text-xs font-bold text-gray-400 hover:text-white rounded-lg transition-all duration-300">
                <i class="fa-solid fa-bolt mr-1"></i> 極限 15 秒賽
            </button>
        </div>
    </header>

    <!-- 遊戲主要互動區域 -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center items-center relative z-10 px-4">
        
        <!-- 計時器與分數資訊儀表 -->
        <div class="w-full flex justify-between items-center mb-6 px-4 py-3 glass-card rounded-2xl border border-white/10">
            <!-- 剩餘秒數 / 模式狀態 -->
            <div class="flex flex-col">
                <span class="text-xs text-gray-400">倒數計時</span>
                <span id="timer-display" class="pixel-font text-2xl font-bold text-amber-400 neon-text-yellow mt-1">--</span>
            </div>
            
            <!-- 挑戰次數 / 點擊數 -->
            <div class="flex flex-col items-end">
                <span id="score-label" class="text-xs text-gray-400">乾杯總數</span>
                <span id="click-count" class="pixel-font text-3xl font-extrabold text-pink-500 neon-text-pink mt-1">0</span>
            </div>
        </div>

        <!-- 酒杯主體 (互動點擊區域) -->
        <div id="drink-area" class="relative cursor-pointer my-4 group" onclick="handleShotClick(event)">
            
            <!-- 倒數 Ready Overlay -->
            <div id="ready-overlay" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/70 rounded-3xl backdrop-blur-sm">
                <span id="ready-countdown" class="pixel-font text-6xl text-pink-500 animate-ping">3</span>
                <span class="text-sm font-bold text-amber-300 mt-4 tracking-widest">準備乾杯！</span>
            </div>

            <!-- 酒杯外框容器 -->
            <div class="beer-glass w-48 h-64 mx-auto relative flex flex-col justify-end p-1">
                <!-- 啤酒液體動態 -->
                <div id="beer-liquid" class="beer-liquid">
                    <!-- 頂部泡沫 -->
                    <div class="beer-foam"></div>
                    <!-- 內部飄升氣泡 -->
                    <div class="bubble w-2 h-2 left-4" style="animation-delay: 0s;"></div>
                    <div class="bubble w-3 h-3 left-12" style="animation-delay: 0.5s;"></div>
                    <div class="bubble w-2 h-2 left-24" style="animation-delay: 1.2s;"></div>
                    <div class="bubble w-4 h-4 left-36" style="animation-delay: 0.8s;"></div>

                <!-- 酒杯玻璃光澤紋理 -->
                <div class="absolute inset-0 pointer-events-none bg-gradient-to-tr from-transparent via-white/10 to-transparent"></div>
            </div>

            <!-- 點擊提示語 -->
            <div id="click-hint" class="text-center mt-6 text-sm text-pink-300 font-bold tracking-widest animate-bounce">
                🔥 點擊酒杯 開始乾杯！ 🔥
            </div>
        </div>

    </main>

    <!-- 底部功能控制區 -->
    <footer class="w-full max-w-md p-4 z-10 flex space-x-3">
        <button onclick="openLeaderboardModal()" class="flex-1 py-3 bg-purple-900/60 hover:bg-purple-800/80 text-purple-200 border border-purple-500/40 rounded-xl font-bold text-sm tracking-wider flex items-center justify-center space-x-2 transition-all active:scale-95 glass-card">
            <i class="fa-solid fa-trophy text-amber-400"></i>
            <span>雲端排行榜</span>

        <button id="reset-btn" onclick="resetGame()" class="py-3 px-5 bg-gray-800/60 hover:bg-gray-700/80 text-gray-300 border border-gray-600/40 rounded-xl font-bold text-sm transition-all active:scale-95 glass-card">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
    </footer>

    <!-- ------------------ MODALS (彈窗系統) ------------------ -->

    <!-- 1. 極限模式輸入暱稱 Modal -->
    <div id="nickname-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="glass-card w-full max-w-sm rounded-2xl p-6 border border-pink-500/40 neon-border-pink relative flex flex-col items-center">
            <div class="w-14 h-14 bg-pink-500/20 rounded-full flex items-center justify-center mb-4 text-pink-500 text-2xl border border-pink-500/40">
                <i class="fa-solid fa-fire-flame-curated"></i>
            </div>
            <h2 class="text-xl font-bold text-white tracking-wider mb-2">準備進入極限賽</h2>
            <p class="text-xs text-gray-300 text-center mb-6 leading-relaxed">
                15 秒內挑戰連點極限！成績將同步至雲端排行榜。<br>
                <span class="text-amber-400 font-bold">製作人最高紀錄：197 次</span>
            </p>
            
            <input type="text" id="player-nickname" placeholder="請輸入您的大名 / 暱稱" maxlength="12" class="w-full px-4 py-3 bg-gray-900/90 border border-purple-500/50 rounded-xl text-white text-center focus:outline-none focus:border-pink-500 mb-6 font-bold tracking-wider">

            <div class="flex space-x-3 w-full">
                <button onclick="closeNicknameModal()" class="flex-1 py-3 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-xl text-sm transition-all">
                    取消
                </button>
                <button onclick="confirmStartExtreme()" class="flex-1 py-3 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold rounded-xl text-sm shadow-lg hover:brightness-110 transition-all">
                    開始挑戰！
                </button>
            </div>
        </div>

    <!-- 2. 結算獎牌 Modal -->
    <div id="result-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
        <div class="glass-card w-full max-w-sm rounded-2xl p-6 border border-amber-500/40 neon-border-purple relative flex flex-col items-center text-center">
            <div class="text-5xl mb-3 animate-bounce" id="result-icon">🍺</div>
            <h2 class="text-2xl font-black text-amber-300 neon-text-yellow mb-1 tracking-wider" id="result-title">酒豪誕生！</h2>
            <p class="text-xs text-gray-300 mb-4" id="result-subtitle">15秒極限挑戰結束</p>

            <!-- 得分看板 -->
            <div class="w-full py-4 my-2 bg-gray-900/80 rounded-xl border border-white/10 flex flex-col items-center">
                <span class="text-xs text-gray-400 mb-1">最終 Shot 數</span>
                <span id="final-score" class="pixel-font text-4xl text-pink-500 neon-text-pink">0</span>
            </div>

            <!-- 評語 -->
            <p id="result-comment" class="text-sm text-purple-200 font-bold my-3 px-2">「千杯不醉！酒吧的傳奇人物就是你！」</p>

            <!-- 按鈕 -->
            <div class="flex space-x-3 w-full mt-4">
                <button onclick="closeResultModal()" class="flex-1 py-3 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-xl text-sm">
                    關閉
                </button>
                <button onclick="restartExtremeGame()" class="flex-1 py-3 bg-gradient-to-r from-amber-500 to-pink-600 text-white font-bold rounded-xl text-sm shadow-lg">
                    再喝一杯！
                </button>

    <!-- 3. 雲端排行榜 Modal -->
    <div id="leaderboard-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="glass-card w-full max-w-md rounded-2xl p-6 border border-purple-500/40 flex flex-col h-[75vh]">
            <!-- 標頭 -->
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-white/10">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-trophy text-amber-400 text-xl"></i>
                    <h3 class="text-lg font-bold text-white tracking-wider">極限雲端排行榜</h3>
                </div>
                <button onclick="closeLeaderboardModal()" class="text-gray-400 hover:text-white text-lg px-2">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 排行榜清單 -->
            <div id="leaderboard-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <div class="text-center py-10 text-gray-400 text-sm">
                    <i class="fa-solid fa-spinner animate-spin text-2xl text-pink-500 mb-2"></i><br>
                    雲端酒豪資料載入中...
                </div>
            </div>

            <!-- 底部按鈕 -->
            <div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center text-xs text-gray-400">
                <span>即時連線至 Firebase 雲端資料庫</span>
                <button onclick="loadLeaderboardData()" class="text-pink-400 hover:text-pink-300 font-bold">
                    <i class="fa-solid fa-rotate mr-1"></i>重新整理
                </button>
            </div>
        </div>
    </div>

    <!-- ------------------ JS 邏輯腳本 ------------------ -->
    <script>
        // 遊戲狀態變數
        let currentMode = 'casual'; // 'casual' | 'extreme'
        let clicks = 0;
        let isPlaying = false;
        let timerInterval = null;
        let remainingSeconds = 15;
        let playerName = "神秘酒客";

        // DOM 元素引用
        const drinkArea = document.getElementById('drink-area');
        const beerLiquid = document.getElementById('beer-liquid');
        const clickCountEl = document.getElementById('click-count');
        const timerDisplayEl = document.getElementById('timer-display');
        const readyOverlay = document.getElementById('ready-overlay');
        const readyCountdownEl = document.getElementById('ready-countdown');
        const clickHintEl = document.getElementById('click-hint');

        // 切換模式
        function switchMode(mode) {
            if (isPlaying) return;
            currentMode = mode;

            const casualBtn = document.getElementById('mode-casual-btn');
            const extremeBtn = document.getElementById('mode-extreme-btn');

            if (mode === 'casual') {
                casualBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-300 bg-gradient-to-r from-pink-600 to-purple-600 text-white shadow-lg";
                extremeBtn.className = "flex-1 py-2 text-xs font-bold text-gray-400 hover:text-white rounded-lg transition-all duration-300";
                clickHintEl.innerText = "🔥 點擊酒杯 開始乾杯！ 🔥";
            } else {
                extremeBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-300 bg-gradient-to-r from-pink-600 to-purple-600 text-white shadow-lg";
                casualBtn.className = "flex-1 py-2 text-xs font-bold text-gray-400 hover:text-white rounded-lg transition-all duration-300";
                clickHintEl.innerText = "⚡ 點擊酒杯 觸發極限挑戰 ⚡";
            }
            resetGame();
        }

        // 點擊酒杯事件
        function handleShotClick(e) {
            // 觸發視覺效果
            createPopText(e);
            createRipple(e);

            if (currentMode === 'casual') {
                clicks++;
                updateUI();
                decreaseLiquidTemp();
            } else if (currentMode === 'extreme') {
                if (!isPlaying) {
                    // 極限模式：第一次點擊開啟暱稱彈窗
                    openNicknameModal();
                } else {
                    clicks++;
                    updateUI();
                    decreaseLiquidTemp();
                }
            }
        }

        // 浮動點擊數字特效
        function createPopText(e) {
            const rect = drinkArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const pop = document.createElement('div');
            pop.className = 'click-pop pixel-font';
            pop.innerText = '+1';
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;

            drinkArea.appendChild(pop);
            setTimeout(() => pop.remove(), 600);
        }

        // 波紋特效
        function createRipple(e) {
            const rect = drinkArea.getBoundingClientRect();
            const circle = document.createElement('div');
            const diameter = Math.max(rect.width, rect.height);
            const radius = diameter / 2;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - radius}px`;
            circle.style.top = `${e.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            drinkArea.appendChild(circle);
            setTimeout(() => circle.remove(), 500);
        }

        // 動態水位變化 (模擬喝飲料)
        function decreaseLiquidTemp() {
            let currentHeight = parseFloat(beerLiquid.style.height || "100");
            currentHeight -= 8;
            if (currentHeight < 15) currentHeight = 100; // 喝完自動補滿
            beerLiquid.style.height = `${currentHeight}%`;
        }

        // 更新介面數字
        function updateUI() {
            clickCountEl.innerText = clicks;
        }

        // 重置遊戲狀態
        function resetGame() {
            clearInterval(timerInterval);
            isPlaying = false;
            clicks = 0;
            remainingSeconds = 15;
            updateUI();
            beerLiquid.style.height = "100%";
            timerDisplayEl.innerText = currentMode === 'casual' ? "--" : "15";
            readyOverlay.classList.add('hidden');
        }

        // --- 極限模式流程 ---

        function openNicknameModal() {
            document.getElementById('nickname-modal').classList.remove('hidden');
        }

        function closeNicknameModal() {
            document.getElementById('nickname-modal').classList.add('hidden');
        }

        function confirmStartExtreme() {
            const inputName = document.getElementById('player-nickname').value.trim();
            playerName = inputName || "神秘酒客";
            closeNicknameModal();
            startReadyCountdown();
        }

        // 倒數 Ready (3, 2, 1)
        function startReadyCountdown() {
            readyOverlay.classList.remove('hidden');
            let readyCount = 3;
            readyCountdownEl.innerText = readyCount;

            const readyTimer = setInterval(() => {
                readyCount--;
                if (readyCount > 0) {
                    readyCountdownEl.innerText = readyCount;
                } else {
                    clearInterval(readyTimer);
                    readyOverlay.classList.add('hidden');
                    startExtremeGame();
                }
            }, 800);
        }

        // 正式開始 15 秒極限賽
        function startExtremeGame() {
            isPlaying = true;
            clicks = 0;
            remainingSeconds = 15;
            updateUI();
            timerDisplayEl.innerText = remainingSeconds;

            const startTime = Date.now();
            const duration = 15000; // 15秒

            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const left = Math.ceil((duration - elapsed) / 1000);

                if (left >= 0) {
                    timerDisplayEl.innerText = left;
                }

                if (elapsed >= duration) {
                    clearInterval(timerInterval);
                    finishExtremeGame();
                }
            }, 100);
        }

        // 極限賽結束結算
        async function finishExtremeGame() {
            isPlaying = false;
            timerDisplayEl.innerText = "0";

            // 顯示結果 Modal
            document.getElementById('final-score').innerText = clicks;
            
            // 評價系統
            const titleEl = document.getElementById('result-title');
            const commentEl = document.getElementById('result-comment');
            const iconEl = document.getElementById('result-icon');

            if (clicks >= 150) {
                iconEl.innerText = "🏆";
                titleEl.innerText = "神級酒豪！";
                commentEl.innerText = "「無人能及的手速！今晚整間酒吧都為你喝采！」";
            } else if (clicks >= 100) {
                iconEl.innerText = "🔥";
                titleEl.innerText = "酒吧狂歡者！";
                commentEl.innerText = "「太強了！你已經超越了 90% 的酒客！」";
            } else {
                iconEl.innerText = "🍺";
                titleEl.innerText = "微醺挑戰者！";
                commentEl.innerText = "「表現不錯！再接再厲，準備下一次乾杯！」";
            }

            document.getElementById('result-modal').classList.remove('hidden');

            // 寫入 Firebase 雲端資料庫
            if (window.saveScoreToCloud) {
                await window.saveScoreToCloud(playerName, clicks);
            }
        }

        function closeResultModal() {
            document.getElementById('result-modal').classList.add('hidden');
            resetGame();
        }

        function restartExtremeGame() {
            closeResultModal();
            startReadyCountdown();
        }

        // --- 排行榜 Modal 系統 ---

        function openLeaderboardModal() {
            document.getElementById('leaderboard-modal').classList.remove('hidden');
            loadLeaderboardData();
        }

        function closeLeaderboardModal() {
            document.getElementById('leaderboard-modal').classList.add('hidden');
        }

        // 讀取並渲染雲端排行榜
        async function loadLeaderboardData() {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = `
                <div class="text-center py-10 text-gray-400 text-sm">
                    <i class="fa-solid fa-spinner animate-spin text-2xl text-pink-500 mb-2"></i><br>
                    即時連線 Firebase 資料庫中...
                </div>
            `;

            if (window.fetchCloudLeaderboard) {
                const data = await window.fetchCloudLeaderboard();
                if (data && data.length > 0) {
                    listEl.innerHTML = "";
                    data.forEach((item, index) => {
                        let rankBadge = `<span class="w-6 text-center font-bold text-gray-400">${index + 1}</span>`;
                        let rankBg = "bg-gray-900/50 border-white/5";

                        if (index === 0) {
                            rankBadge = `<i class="fa-solid fa-crown text-amber-400 text-lg w-6 text-center"></i>`;
                            rankBg = "bg-amber-500/10 border-amber-500/30";
                        } else if (index === 1) {
                            rankBadge = `<i class="fa-solid fa-medal text-slate-300 text-lg w-6 text-center"></i>`;
                            rankBg = "bg-slate-500/10 border-slate-500/30";
                        } else if (index === 2) {
                            rankBadge = `<i class="fa-solid fa-award text-amber-700 text-lg w-6 text-center"></i>`;
                            rankBg = "bg-amber-900/10 border-amber-800/30";
                        }

                        const row = document.createElement('div');
                        row.className = `flex justify-between items-center p-3 rounded-xl border ${rankBg}`;
                        row.innerHTML = `
                            <div class="flex items-center space-x-3">
                                ${rankBadge}
                                <span class="text-sm font-bold text-gray-200">${escapeHtml(item.name)}</span>
                            </div>
                            <div class="pixel-font text-pink-400 font-extrabold text-sm">
                                ${item.score} <span class="text-xs text-gray-400 font-normal">SHOTS</span>
                            </div>
                        `;
                        listEl.appendChild(row);
                    });
                } else {
                    listEl.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">尚無挑戰紀錄，快成為第一個酒豪！</div>`;
                }
            } else {
                listEl.innerHTML = `<div class="text-center py-10 text-red-400 text-sm">雲端資料庫連線失敗</div>`;
            }
        }

        // XSS 防護安全轉換
        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
