<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOT! - 測試版</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Firebase SDK (v9 Modular Scripts) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyA5_QR7dEjIx6RTghTqcB5jgCs6c-4nHQY",
            authDomain: "shottime-397a4.firebaseapp.com",
            projectId: "shottime-397a4",
            storageBucket: "shottime-397a4.firebasestorage.app",
            messagingSenderId: "543397406837",
            appId: "1:543397406837:web:79429dc37c8aad0014b03c",
            measurementId: "G-1KCTHMZ8KN"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 掛載全域 Firebase 寫入與讀取方法
        window.saveScoreToCloud = async function(playerName, score) {
            try {
                await addDoc(collection(db, "leaderboard"), {
                    name: playerName || "神秘酒客",
                    score: Number(score),
                    createdAt: serverTimestamp()
                });
                return true;
            } catch (e) {
                console.error("寫入 Firestore 失敗:", e);
                return false;
            }
        };

        window.fetchCloudLeaderboard = async function() {
            try {
                const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
                const querySnapshot = await getDocs(q);
                const scores = [];
                querySnapshot.forEach((doc) => {
                    scores.push(doc.data());
                });
                return scores;
            } catch (e) {
                console.error("讀取 Firestore 失敗:", e);
                return null;
            }
        };
    </script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #050608;
            color: #f3f4f6;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .title-font {
            font-family: 'Cinzel', serif;
        }

        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }

        /* 霓虹燈光陰影特效 */
        .neon-text-pink {
            text-shadow: 0 0 5px #ff007f, 0 0 15px #ff007f, 0 0 30px #ff007f;
        }
        .neon-text-yellow {
            text-shadow: 0 0 5px #ffd700, 0 0 15px #ffd700, 0 0 25px #ffd700;
        }

        /* 玻璃擬態樣式 */
        .glass-card {
            background: rgba(20, 15, 35, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* 酒杯與啤酒動態造型 */
        .beer-glass {
            position: relative;
            background: linear-gradient(to right, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.2) 100%);
            border: 5px solid rgba(255, 255, 255, 0.5);
            border-top: none;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,215,0,0.2);
            overflow: hidden;
        }

        .beer-liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(to top, #e67e22, #f1c40f, #f39c12);
            transition: height 0.12s ease-out;
        }

        .beer-foam {
            position: absolute;
            top: -12px;
            left: 0;
            right: 0;
            height: 16px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(255,255,255,0.8);
        }

        /* 氣泡上升動畫 */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            bottom: 0;
            animation: bubbleUp 2s infinite ease-in;
        }

        @keyframes bubbleUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-200px) scale(1.2); opacity: 0; }
        }

        /* 點擊飛出數字 */
        .click-pop {
            position: absolute;
            color: #ffd700;
            font-weight: 900;
            font-size: 2rem;
            pointer-events: none;
            animation: popAndFade 0.5s forwards ease-out;
            text-shadow: 0 0 10px #ff007f;
            z-index: 60;
        }

        @keyframes popAndFade {
            0% { transform: translate(-50%, -50%) scale(0.6) rotate(0deg); opacity: 1; }
            50% { transform: translate(-50%, -100%) scale(1.4) rotate(-10deg); opacity: 0.9; }
            100% { transform: translate(-50%, -150%) scale(1) rotate(10deg); opacity: 0; }
        }

        /* 水波波紋動畫 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 0, 127, 0.4);
            transform: scale(0);
            animation: rippleEffect 0.4s linear;
            pointer-events: none;
            z-index: 55;
        }

        @keyframes rippleEffect {
            to { transform: scale(4); opacity: 0; }
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 10, 25, 0.6); }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 3px; }
    </style>
</head>

    <!-- ------------------ JS 邏輯腳本 ------------------ -->
    <script>
        // 遊戲狀態變數
        let currentMode = ''; // 'normal' | 'hard' | 'extreme'
        let targetClicks = 150;
        let clicks = 0; // 普通/困難代表「剩餘次數」，極限代表「累計點數」
        let isPlaying = false;
        let isReadying = false;
        let timerInterval = null;
        let remainingSeconds = 15;
        let playerName = "神秘酒客";

        // DOM 元素引用
        const homeMenu = document.getElementById('home-menu');
        const gameContainer = document.getElementById('game-container');
        const timerDisplayEl = document.getElementById('timer-display');
        const clicksDisplayEl = document.getElementById('clicks-display');
        const clicksLabelEl = document.getElementById('clicks-label');
        const beerLiquid = document.getElementById('beer-liquid');
        const statusOverlay = document.getElementById('status-overlay');
        const statusOverlayText = document.getElementById('status-overlay-text');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnNextMode = document.getElementById('btn-next-mode');

        // Modal 顯隱操作
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }
        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // 啟動模式流程
        function startMode(mode) {
            currentMode = mode;

            if (mode === 'extreme') {
                openModal('nickname-modal');
                return;
            }

            if (mode === 'normal') targetClicks = 150;
            if (mode === 'hard') targetClicks = 180;

            initGameUI();
            startReadyCountdown();
        }

        function confirmStartExtreme() {
            const input = document.getElementById('player-nickname').value.trim();
            playerName = input || "神秘酒客";
            closeModal('nickname-modal');
            
            initGameUI();
            startReadyCountdown();
        }

        // 初始化遊戲畫面
        function initGameUI() {
            homeMenu.classList.add('hidden');
            gameContainer.classList.remove('hidden');

            btnNextMode.classList.add('hidden');
            btnLeft.innerText = "終止挑戰";
            btnRight.innerText = "重新挑戰";

            if (currentMode === 'extreme') {
                clicksLabelEl.innerText = "SHOT 數";
                clicks = 0;
            } else {
                clicksLabelEl.innerText = "剩餘連點";
                clicks = targetClicks;
            }

            remainingSeconds = 15;
            timerDisplayEl.innerText = "15";
            updateClicksDisplay();
            beerLiquid.style.height = "100%";
        }

        // 倒數 Ready? -> 2 -> 1 -> GO!
        function startReadyCountdown() {
            isReadying = true;
            isPlaying = false;
            statusOverlay.classList.remove('hidden');

            const seq = ["Ready?", "2", "1", "GO!"];
            let idx = 0;

            statusOverlayText.innerText = seq[idx];

            const readyTimer = setInterval(() => {
                idx++;
                if (idx < seq.length) {
                    statusOverlayText.innerText = seq[idx];
                } else {
                    clearInterval(readyTimer);
                    statusOverlay.classList.add('hidden');
                    isReadying = false;
                    startGameTimer();
                }
            }, 600);
        }

        // 開啟 15 秒精準倒數計時器
        function startGameTimer() {
            isPlaying = true;
            const startTime = Date.now();
            const duration = 15000; // 15 秒

            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const left = Math.ceil((duration - elapsed) / 1000);

                if (left >= 0) {
                    timerDisplayEl.innerText = left;
                }

                if (elapsed >= duration) {
                    clearInterval(timerInterval);
                    finishGame(false); // 時間到的結算
                }
            }, 100);
        }

        // 全螢幕點擊感應事件 handler
        function handleTapAreaClick(e) {
            if (!isPlaying || isReadying) return;

            // 生成飛出數字與波紋特效
            createPopText(e);
            createRipple(e);

            if (currentMode === 'extreme') {
                clicks++;
                updateClicksDisplay();
            } else {
                if (clicks > 0) {
                    clicks--;
                    updateClicksDisplay();
                    updateBeerLiquidLevel();

                    // 通關判定
                    if (clicks === 0) {
                        clearInterval(timerInterval);
                        finishGame(true); // 成功擊破
                    }
                }
            }
        }

        // 更新點擊數字
        function updateClicksDisplay() {
            if (currentMode === 'extreme') {
                clicksDisplayEl.innerText = `${clicks} 杯`;
            } else {
                clicksDisplayEl.innerText = clicks;
            }
        }

        // 動態水位消退邏輯
        function updateBeerLiquidLevel() {
            if (currentMode === 'extreme') return;

            // 根據剩餘點擊次數切換水位 (120下 80%、90下 60%、60下 40%、30下 20%、0下 剩酒杯)
            if (clicks > 120) beerLiquid.style.height = "100%";
            else if (clicks > 90) beerLiquid.style.height = "80%";
            else if (clicks > 60) beerLiquid.style.height = "60%";
            else if (clicks > 30) beerLiquid.style.height = "40%";
            else if (clicks > 0) beerLiquid.style.height = "20%";
            else beerLiquid.style.height = "0%";
        }

        // 遊戲結算 (通關/失敗/極限結束)
        async function finishGame(isSuccess) {
            isPlaying = false;

            if (currentMode === 'extreme') {
                // 極限模式顯示 Time's up 隨後開啟排行榜
                statusOverlayText.innerText = "Time's up";
                statusOverlay.classList.remove('hidden');

                if (window.saveScoreToCloud) {
                    await window.saveScoreToCloud(playerName, clicks);
                }

                setTimeout(() => {
                    statusOverlay.classList.add('hidden');
                    backToHome();
                    openLeaderboardModal();
                }, 1500);

            } else {
                if (isSuccess) {
                    // 挑戰成功
                    statusOverlayText.innerText = "挑戰成功！";
                    statusOverlay.classList.remove('hidden');

                    setTimeout(() => {
                        statusOverlay.classList.add('hidden');
                        if (currentMode === 'normal') {
                            btnNextMode.innerText = "困難模式";
                            btnNextMode.classList.remove('hidden');
                        } else if (currentMode === 'hard') {
                            btnNextMode.innerText = "返回首頁";
                            btnNextMode.classList.remove('hidden');
                        }
                    }, 1000);

                } else {
                    // 挑戰失敗
                    statusOverlayText.innerText = "挑戰失敗！";
                    statusOverlay.classList.remove('hidden');

                    btnLeft.innerText = "不玩了";
                    btnRight.innerText = "再來一次";
                }
            }
        }

        // 底部左鈕操作 (終止挑戰 / 不玩了)
        function handleLeftBtn() {
            clearInterval(timerInterval);
            backToHome();
        }

        // 底部右鈕操作 (重新挑戰 / 再來一次)
        function handleRightBtn() {
            clearInterval(timerInterval);
            startMode(currentMode);
        }

        // 返回首頁
        function backToHome() {
            isPlaying = false;
            isReadying = false;
            clearInterval(timerInterval);

            gameContainer.classList.add('hidden');
            homeMenu.classList.remove('hidden');
            statusOverlay.classList.add('hidden');
        }

        // --- 特效生成函式 ---

        function createPopText(e) {
            const pop = document.createElement('div');
            pop.className = 'click-pop pixel-font';
            pop.innerText = '+1';
            pop.style.left = `${e.clientX}px`;
            pop.style.top = `${e.clientY}px`;

            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 500);
        }

        function createRipple(e) {
            const circle = document.createElement('div');
            const diameter = 120;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - diameter / 2}px`;
            circle.style.top = `${e.clientY - diameter / 2}px`;
            circle.classList.add('ripple');

            document.body.appendChild(circle);
            setTimeout(() => circle.remove(), 400);
        }

        // --- 雲端排行榜 modal ---

        function openLeaderboardModal() {
            openModal('leaderboard-modal');
            loadLeaderboardData();
        }

        async function loadLeaderboardData() {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = `
                <div class="text-center py-10 text-gray-400 text-sm">
                    <i class="fa-solid fa-spinner animate-spin text-2xl text-pink-500 mb-2"></i><br>
                    雲端資料載入中...
                </div>
            `;

            if (window.fetchCloudLeaderboard) {
                const data = await window.fetchCloudLeaderboard();
                if (data && data.length > 0) {
                    listEl.innerHTML = "";
                    data.forEach((item, index) => {
                        let rankBadge = `<span class="w-6 text-center font-bold text-gray-400">${index + 1}</span>`;
                        let rankBg = "bg-gray-900/50 border-white/5";
                        let rankColor = "text-purple-400"; // 4名以後紫色

                        if (index === 0) {
                            rankBadge = `<i class="fa-solid fa-crown text-amber-400 text-base w-6 text-center"></i>`;
                            rankBg = "bg-amber-500/10 border-amber-500/30";
                            rankColor = "text-amber-400 font-black"; // 第1名金色
                        } else if (index === 1) {
                            rankBadge = `<i class="fa-solid fa-medal text-slate-300 text-base w-6 text-center"></i>`;
                            rankBg = "bg-slate-500/10 border-slate-500/30";
                            rankColor = "text-slate-300 font-bold"; // 第2名銀色
                        } else if (index === 2) {
                            rankBadge = `<i class="fa-solid fa-award text-amber-700 text-base w-6 text-center"></i>`;
                            rankBg = "bg-amber-900/10 border-amber-800/30";
                            rankColor = "text-amber-600 font-bold"; // 第3名銅色
                        }

                        const row = document.createElement('div');
                        row.className = `flex justify-between items-center p-3 rounded-xl border ${rankBg}`;
                        row.innerHTML = `
                            <div class="flex items-center space-x-3">
                                ${rankBadge}
                                <span class="text-sm font-bold ${rankColor}">${escapeHtml(item.name)}</span>
                            </div>
                            <div class="pixel-font ${rankColor} text-sm">
                                ${item.score} <span class="text-[10px] text-gray-400 font-normal">SHOTS</span>
                            </div>
                        `;
                        listEl.appendChild(row);
                    });
                } else {
                    listEl.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">尚無挑戰紀錄</div>`;
                }
            } else {
                listEl.innerHTML = `<div class="text-center py-10 text-red-400 text-sm">雲端連線失敗</div>`;
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
