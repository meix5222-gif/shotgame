<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOT!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #222; color: #fff; text-align: center; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #app { width: 360px; height: 640px; background: #333; position: relative; border: 2px solid #555; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }

    /* 頂部控制項 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; z-index: 10; }
    .btn-icon { background: none; border: none; font-size: 24px; cursor: pointer; color: #fff; }

    /* 標題與小字 */
    h1 { font-size: 36px; color: #f1c40f; margin-top: 5px; }
    .subtitle { font-size: 14px; color: #bbb; margin-bottom: 10px; }

    /* 啤酒顯示區 */
    .beer-container { flex: 1; display: flex; justify-content: center; align-items: center; flex-direction: column; cursor: pointer; user-select: none; }
    .beer-img { width: 140px; height: 180px; background: #e67e22; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 20px; transition: transform 0.05s ease; border: 4px solid #fff; }
    .beer-img.tap-effect { transform: scale(0.92); }

    /* 按鈕樣式 */
    .btn-container { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 10px; }
    .btn { background: #e74c3c; color: white; border: none; padding: 12px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .btn:hover { background: #c0392b; }

    /* 彈窗背景與內容 */
    .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 100; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
    .modal-content { background: #444; padding: 20px; border-radius: 10px; text-align: left; max-width: 90%; width: 100%; max-height: 80%; overflow-y: auto; }
    .modal-content h3 { text-align: center; margin-bottom: 15px; color: #f1c40f; }
    .modal-content p { font-size: 14px; line-height: 1.6; color: #ddd; }
    .close-btn { margin-top: 15px; width: 100%; background: #7f8c8d; }

    /* 排行榜顏色設定 */
    .rank-item { font-size: 16px; margin: 8px 0; font-weight: bold; }
    .rank-1 { color: #f1c40f; } /* 金 */
    .rank-2 { color: #bdc3c7; } /* 銀 */
    .rank-3 { color: #cd7f32; } /* 銅 */
    .rank-other { color: #9b59b6; } /* 紫 */

    /* 底部製作人小字 */
    .footer { font-size: 12px; color: #888; margin-top: 5px; }

    /* 遊戲內顯示資訊 */
    .game-status { font-size: 20px; margin-bottom: 10px; }
    .timer { font-size: 32px; font-weight: bold; color: #e74c3c; }
    .countdown-overlay { font-size: 48px; font-weight: bold; color: #f1c40f; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 50; }
  </style>
</head>
<body>

<div id="app">
  <!-- 頂部列：說明與排行榜 -->
  <div class="top-bar">
    <button class="btn-icon" onclick="openModal('infoModal')">❓</button>
    <button class="btn-icon" onclick="openLeaderboard()">🏆</button>
  </div>

  <!-- 主標題與小字 -->
  <div>
    <h1>SHOT!</h1>
    <div class="subtitle">-測試版-</div>
  </div>

  <!-- 遊戲倒數提示 -->
  <div id="readyOverlay" class="countdown-overlay" style="display: none;">Ready?</div>

  <!-- 中央啤酒展示/點擊區 -->
  <div class="beer-container" id="beerArea" onclick="handleTap()">
    <div id="gameInfo" style="display: none;">
      <div class="timer" id="timer">15</div>
      <div class="game-status" id="clickStatus">150/150</div>
    </div>
    <!-- 保留原本啤酒圖片位置，後續可自行替換 <img> -->
    <div class="beer-img" id="beerGraphic">🍺 <span id="beerCapacity">100%</span></div>
  </div>

  <!-- 封面模式選擇按鈕區 -->
  <div class="btn-container" id="menuButtons">
    <button class="btn" onclick="startReady('normal')">普通模式</button>
    <button class="btn" onclick="startReady('hard')">困難模式</button>
    <button class="btn" onclick="startReady('extreme')">極限模式</button>
  </div>

  <!-- 遊戲中/結算按鈕區 -->
  <div class="btn-container" id="gameButtons" style="display: none;">
    <div style="display: flex; justify-content: space-between; gap: 10px;">
      <button class="btn" style="flex: 1; background: #7f8c8d;" id="leftBtn" onclick="handleLeftBtn()">終止挑戰</button>
      <button class="btn" style="flex: 1;" id="rightBtn" onclick="handleRightBtn()">重新挑戰</button>
    </div>
    <button class="btn" id="nextModeBtn" style="display: none; background: #2ecc71;" onclick="handleNextMode()">困難模式</button>
  </div>

  <div class="footer">-製作人：麻糬-</div>

  <!-- 說明彈窗 -->
  <div class="modal" id="infoModal">
    <div class="modal-content">
      <h3>遊戲說明</h3>
      <p>1. 普通模式：15秒內點擊螢幕150下即挑戰成功。</p>
      <p>2. 困難模式：15秒內點擊螢幕200下即挑戰成功。</p>
      <p>3. 極限模式：挑戰15秒內最多點擊數。</p>
      <p>4. 排行榜僅會記錄極限模式分數。</p>
      <p>5. 僅供娛樂用。</p>
      <button class="btn close-btn" onclick="closeModal('infoModal')">關閉</button>
    </div>
  </div>

  <!-- 排行榜彈窗 -->
  <div class="modal" id="leaderboardModal">
    <div class="modal-content">
      <h3>極限排行榜</h3>
      <div id="leaderboardList">載入中...</div>
      <button class="btn close-btn" onclick="closeModal('leaderboardModal')">關閉</button>
    </div>
  </div>
</div>

<script>
  let currentMode = ''; // 'normal', 'hard', 'extreme'
  let clicks = 0;
  let targetClicks = 150;
  let timeLeft = 15;
  let timerInterval = null;
  let isPlaying = false;
  let playerName = '';

  // 模擬資料庫儲存 (預設可對接 Firebase / Supabase)
  let mockDatabase = [
    { name: "酒神", score: 220 },
    { name: "製作人麻糬", score: 197 },
    { name: "路人乙", score: 150 },
    { name: "挑戰者A", score: 120 }
  ];

  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  // 進入 Ready 倒數流程
  function startReady(mode) {
    currentMode = mode;
    if (mode === 'extreme') {
      let input = prompt("輸入您的暱稱，製作人最高紀錄197，祝您挑戰成功", playerName || "玩家");
      if (!input) return;
      playerName = input;
    }
    
    // UI 切換到 Ready 狀態
    document.getElementById('menuButtons').style.display = 'none';
    document.getElementById('gameButtons').style.display = 'flex';
    document.getElementById('leftBtn').innerText = '終止挑戰';
    document.getElementById('rightBtn').innerText = '重新挑戰';
    document.getElementById('nextModeBtn').style.display = 'none';
    document.getElementById('gameInfo').style.display = 'block';

    resetGameData();

    // Ready 2, 1, GO!
    let overlay = document.getElementById('readyOverlay');
    overlay.style.display = 'block';
    let seq = ["Ready?", "2", "1", "GO!"];
    let idx = 0;
    
    let readyTimer = setInterval(() => {
      overlay.innerText = seq[idx];
      idx++;
      if (idx >= seq.length) {
        clearInterval(readyTimer);
        setTimeout(() => {
          overlay.style.display = 'none';
          startGame();
        }, 500);
      }
    }, 600);
  }

  function resetGameData() {
    clicks = 0;
    timeLeft = 15;
    document.getElementById('timer').innerText = timeLeft;
    
    if (currentMode === 'normal') targetClicks = 150;
    if (currentMode === 'hard') targetClicks = 200;

    updateDisplay();
  }

  function startGame() {
    isPlaying = true;
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').innerText = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function handleTap() {
    if (!isPlaying) return;
    clicks++;

    // 動態效果
    let beer = document.getElementById('beerGraphic');
    beer.classList.add('tap-effect');
    setTimeout(() => beer.classList.remove('tap-effect'), 50);

    updateDisplay();

    // 通關判定 (普通/困難)
    if (currentMode !== 'extreme') {
      let remaining = targetClicks - clicks;
      if (remaining <= 0) {
        endGame(true);
      }
    }
  }

  function updateDisplay() {
    let beerCap = document.getElementById('beerCapacity');
    
    if (currentMode === 'extreme') {
      document.getElementById('clickStatus').innerText = `${clicks} 杯Shot`;
    } else {
      let remaining = Math.max(0, targetClicks - clicks);
      document.getElementById('clickStatus').innerText = `${remaining}/${targetClicks}`;
      
      // 動態容量判定 (以普通模式150下計，或困難200下按比例)
      let percent = (remaining / targetClicks) * 100;
      if (percent <= 0) beerCap.innerText = "酒杯";
      else if (percent <= 20) beerCap.innerText = "20%";
      else if (percent <= 40) beerCap.innerText = "40%";
      else if (percent <= 60) beerCap.innerText = "60%";
      else if (percent <= 80) beerCap.innerText = "80%";
      else beerCap.innerText = "100%";
    }
  }

  function endGame(isSuccess = false) {
    clearInterval(timerInterval);
    isPlaying = false;

    if (currentMode === 'extreme') {
      document.getElementById('readyOverlay').innerText = "Time’s up";
      document.getElementById('readyOverlay').style.display = 'block';
      saveScore(playerName, clicks);
      setTimeout(() => {
        document.getElementById('readyOverlay').style.display = 'none';
        backToHome();
        openLeaderboard();
      }, 1500);
    } else {
      if (isSuccess || (timeLeft > 0 && (targetClicks - clicks) <= 0)) {
        // 成功
        if (currentMode === 'normal') {
          document.getElementById('nextModeBtn').innerText = "困難模式";
          document.getElementById('nextModeBtn').style.display = 'block';
        } else if (currentMode === 'hard') {
          document.getElementById('nextModeBtn').innerText = "返回首頁";
          document.getElementById('nextModeBtn').style.display = 'block';
        }
      } else {
        // 失敗
        document.getElementById('leftBtn').innerText = '不玩了';
        document.getElementById('rightBtn').innerText = '再來一次';
      }
    }
  }

  function handleLeftBtn() {
    clearInterval(timerInterval);
    backToHome();
  }

  function handleRightBtn() {
    clearInterval(timerInterval);
    startReady(currentMode);
  }

  function handleNextMode() {
    if (currentMode === 'normal') {
      startReady('hard');
    } else {
      backToHome();
    }
  }

  function backToHome() {
    isPlaying = false;
    document.getElementById('gameInfo').style.display = 'none';
    document.getElementById('gameButtons').style.display = 'none';
    document.getElementById('menuButtons').style.display = 'flex';
    document.getElementById('beerCapacity').innerText = "100%";
  }

  // --- 資料庫操作 ---
  function saveScore(name, score) {
    // 寫入資料庫邏輯（此處為本地測試模擬，可更換為 API/Firebase）
    mockDatabase.push({ name: name, score: score });
    mockDatabase.sort((a, b) => b.score - a.score);
  }

  function openLeaderboard() {
    openModal('leaderboardModal');
    let listContainer = document.getElementById('leaderboardList');
    listContainer.innerHTML = '';

    mockDatabase.sort((a, b) => b.score - a.score);

    mockDatabase.forEach((item, index) => {
      let rank = index + 1;
      let colorClass = 'rank-other';
      if (rank === 1) colorClass = 'rank-1';
      else if (rank === 2) colorClass = 'rank-2';
      else if (rank === 3) colorClass = 'rank-3';

      let div = document.createElement('div');
      div.className = `rank-item ${colorClass}`;
      div.innerText = `${rank}. ${item.name} - ${item.score} 杯`;
      listContainer.appendChild(div);
    });
  }
</script>
</body>
</html>
